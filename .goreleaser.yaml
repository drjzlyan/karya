# GoReleaser builds karya as a single static binary for macOS and Linux.
# https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: karya
    main: .
    binary: karya
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/drjzlyan/karya/internal/version.Version={{ .Version }}
      - -X github.com/drjzlyan/karya/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/drjzlyan/karya/internal/version.Date={{ .Date }}

archives:
  - id: karya
    formats: [tar.gz]
    name_template: "karya_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# NOTE: the Homebrew tap (HomebrewFormula/karya.rb) is generated cross-platform
# (macOS + Linux, amd64 + arm64) by scripts/update-formula.sh from the checksums
# below, and committed to `main` by the release workflow — GoReleaser's built-in
# `brews`/`homebrew_casks` are intentionally not used (cask is macOS-only; `brews`
# is deprecated).

release:
  draft: false
  prerelease: auto
  # Attach the standalone installer so `releases/latest/download/install.sh`
  # (referenced by `karya tutorial`) resolves.
  extra_files:
    - glob: ./scripts/install.sh
