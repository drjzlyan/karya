name: Feature request
description: Suggest an idea or enhancement for karya
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what's missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like karya to do? A command sketch helps (e.g. `karya lang add rust`).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: phase
    attributes:
      label: Related roadmap area
      options:
        - Session / tmux
        - Agent management
        - Editor / Neovim
        - Project scaffolding
        - Languages & tools
        - Install / update
        - Docs / tutorial
        - Other
