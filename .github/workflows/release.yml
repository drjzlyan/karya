name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Regenerate the cross-platform Homebrew formula from the release checksums
      # and commit it back to main. Uses a plain formula (macOS + Linux) rather
      # than GoReleaser's deprecated `brews`/macOS-only casks.
      - name: Update Homebrew formula
        run: |
          git config user.name "goreleaser[bot]"
          git config user.email "goreleaser@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          scripts/update-formula.sh "${GITHUB_REF_NAME}" dist/checksums.txt
          git add HomebrewFormula/karya.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula unchanged."
          else
            git commit -m "chore(release): Homebrew formula for ${GITHUB_REF_NAME} [skip ci]"
            git push origin main
          fi
