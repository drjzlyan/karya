# golangci-lint configuration for karya (schema v2).
# https://golangci-lint.run
# Migrated from v1 for golangci-lint-action v9, which installs golangci-lint v2.
version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - misspell
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/drjzlyan/karya
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
