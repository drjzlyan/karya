# golangci-lint configuration for karya.
# https://golangci-lint.run
run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gofmt
    - goimports
    - unconvert
    - bodyclose

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Test helpers and integration tests may intentionally ignore some errors.
    - path: _test\.go
      linters:
        - errcheck

linters-settings:
  goimports:
    local-prefixes: github.com/drjzlyan/karya
  revive:
    rules:
      - name: exported
        disabled: false
